services:
  - type: web
    name: batman-lego-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "80"
      - key: BATMAN_DB_DSN
        sync: false
      - key: BATMAN_DB_USER
        sync: false
      - key: BATMAN_DB_PASSWORD
        sync: false
      - key: BATMAN_DB_CA_PATH
        value: /etc/secrets/ca.pem
